name: Build and Deploy MSA REST Docs

on:
  push:
    branches: [ "dev" ]
    paths: 
      - 'users-service/src/docs/**'
      - 'questions-server/src/docs/**'
      - '.github/workflows/restdocs.yml'
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Repository 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # 3. User Service 문서 빌드
      - name: Grant execute permission for user-service gradlew
        run: chmod +x ./gradlew
        working-directory: ./users-service
      
      - name: Build User Service Docs
        run: ./gradlew asciidoctor
        working-directory: ./users-service

      # 4. Questions Server 문서 빌드  
      - name: Grant execute permission for questions-server gradlew
        run: chmod +x ./gradlew
        working-directory: ./questions-server
        
      - name: Build Questions Server Docs
        run: ./gradlew asciidoctor
        working-directory: ./questions-server

      # 5. 통합 문서 디렉토리 생성
      - name: Create Unified Documentation
        run: |
          mkdir -p unified-docs
          mkdir -p unified-docs/user
          mkdir -p unified-docs/question
          
          # 각 서비스 문서 복사
          if [ -d "./users-service/build/docs/asciidoc" ]; then
            cp -r ./users-service/build/docs/asciidoc/* unified-docs/user/ 2>/dev/null || echo "No user docs to copy"
          fi
          
          if [ -d "./questions-server/build/docs/asciidoc" ]; then
            cp -r ./questions-server/build/docs/asciidoc/* unified-docs/question/ 2>/dev/null || echo "No question docs to copy"
          fi
          
          # 통합 index.html 생성
          cat > unified-docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>TestPrepare API Documentation</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  .service-list { margin: 20px 0; }
                  .service-item { 
                      display: block; 
                      padding: 15px 20px; 
                      margin: 10px 0; 
                      background: #f5f5f5; 
                      text-decoration: none; 
                      color: #333; 
                      border-radius: 5px;
                      transition: background 0.3s;
                  }
                  .service-item:hover { background: #e0e0e0; }
              </style>
          </head>
          <body>
              <h1>🚀 TestPrepare API Documentation</h1>
              <div class="service-list">
                  <a href="user/" class="service-item">
                      <h3>👤 User Service API</h3>
                      <p>사용자 관리, 인증, OAuth 관련 API</p>
                  </a>
                  <a href="question/" class="service-item">
                      <h3>📝 Question Service API</h3>
                      <p>문제 관리, 북마크, 시험 관련 API</p>
                  </a>
              </div>
              <hr>
              <p><small>Last updated: $(date)</small></p>
          </body>
          </html>
          EOF

      # 6. 디버깅: 생성된 파일 확인
      - name: List generated documentation files
        run: |
          echo "=== Unified docs structure ==="
          find unified-docs -type f -name "*.html" | head -10
          echo "=== Directory structure ==="
          ls -la unified-docs/

      # 7. 빌드된 통합 문서 업로드
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./unified-docs

      # 8. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["users-service", "questions-server", "nginx"]
    group_id => "logstash-group"
    auto_offset_reset => "latest"
    codec => "json"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[service]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
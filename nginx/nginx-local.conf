events {
    worker_connections 1024;
}

http {
    client_max_body_size 0;

    log_format json_combined escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"request_time":"$request_time"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    upstream user_service {
        server host.docker.internal:8441;  # Spring Boot의 HTTPS 포트
        # server spring-app:8080;  # Spring Boot의 HTTP 포트
    }    
    upstream questions_server {
        server host.docker.internal:8442;  # Spring Boot의 HTTPS 포트
        # server spring-app:8080;  # Spring Boot의 HTTP 포트
    }

    upstream spring_backend_paypick {
        server spring_paypick:8080;  # Spring Boot의 HTTPS 포트
        # server spring-app:8080;  # Spring Boot의 HTTP 포트
    }
 
    upstream gpt_backend {
        # server gpt-app:8444;
        server gpt-app:8000;
    }

    server {
        listen 80;
        server_name www.testprepare.store;
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name www.testprepare.store;

        # SSL 인증서 설정
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        # SSL 설정 최적화
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # HSTS 설정
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # 불필요한 HTTP 메서드 차단
        if ($request_method !~ ^(GET|POST|HEAD|DELETE|OPTIONS|PATCH)$) {
            return 405;
        }
        
        # 민감한 파일 접근 차단
        location ~ /\.git {
            deny all;
            return 404;
        }
        
        location ~ /\.env {
            deny all;
            return 404;
        }
        
        # 악의적인 User-Agent 차단
        # if ($http_user_agent ~* (l9explore|curl|wget|scrapy|bot|spider)) {
        #     return 403;
        # }
        
        # 요청 본문 크기 제한
        client_max_body_size 10M;
        
        # XSS 방어를 위한 헤더 추가
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self'";
        
        # 비정상적인 요청 차단
        location ~ \.(php|asp|aspx|jsp|cgi|pl)$ {
            deny all;
            return 404;
        }

        # Spring Backend (/bs/**)
        location /bs/ {
            # /bs/를 제거하고 나머지 경로만 전달
            rewrite ^/bs/(.*) /$1 break;
            proxy_pass https://user_service;
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /bs/exam {
            # /bs/를 제거하고 나머지 경로만 전달
            rewrite ^/bs/(.*) /$1 break;
            proxy_pass https://questions_server;
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /bp/ {
            # /bs/를 제거하고 나머지 경로만 전달
            rewrite ^/bp/(.*) /$1 break;
            proxy_pass http://spring_backend_paypick;
            proxy_ssl_verify off;  # 자체 서명 인증서 사용 시 필요
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # GPT Backend (/bf/**)
        location /bf/ {
            # /bf/를 제거하고 나머지 경로만 전달
            rewrite ^/bf/(.*) /$1 break;
            proxy_pass https://gpt_backend;
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}


volumes:
  mysql_master_data: {}
  mysql_slave_data: {}

services:
  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - spring-app
      - gpt-app
    networks:
      - app_network

  mysql-master:
    image: mysql:8.0
    container_name: database-master
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql-master-init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=row
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --log-slave-updates=ON
      - --sync_binlog=1
      - --binlog-do-db=project
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-slave:
    image: mysql:8.0
    container_name: database-slave
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./mysql-slave-init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --log-slave-updates=ON
      - --read-only=1
      - --replicate-do-db=project
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - app_network

  spring-app:
    build: 
      context: ./be
      dockerfile: Dockerfile
    container_name: spring-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_MASTER_URL=${DB_MASTER_URL}
      - SPRING_DATASOURCE_MASTER_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_MASTER_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_SLAVE_URL=${DB_SLAVE_URL}
      - SPRING_DATASOURCE_SLAVE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_SLAVE_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - app_network
  

  gpt-app:
    build:
      context: ./gpt_be
      dockerfile: Dockerfile
    container_name: gpt-app
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql-master
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=project
      - MYSQL_PORT=3306
      - TZ=Asia/Seoul
      - JWT_SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge



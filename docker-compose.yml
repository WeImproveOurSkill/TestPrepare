volumes:
  mysql_master_data: {}
  mysql_slave_data: {}
  redis-data: {}
  redis-token-data: {}

services:
  # Redis 설정
  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: always
    # networks:
    #   - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis-token:
    image: redis:latest
    container_name: redis-token
    ports:
      - "6380:6380"
    volumes:
      - redis-token-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf # Redis 설정 파일 마운트
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes    
    restart: always
    # networks:
    #   - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MySQL Master 설정
  mysql-master:
    image: mysql:8.0
    container_name: database-master
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql-master-init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=row
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --log-slave-updates=ON
      - --sync_binlog=1
      - --binlog-do-db=project
    # networks:
    #   - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Slave 설정
  mysql-slave:
    image: mysql:8.0
    container_name: database-slave
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./mysql-slave-init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --log-slave-updates=ON
      - --read-only=1
      - --replicate-do-db=project
    depends_on:
      mysql-master:
        condition: service_healthy
    # networks:
    #   - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5


  spring_paypick:
    # build:
    #   context: ./be
    #   dockerfile: Dockerfile
    container_name: paypick_spring
    image : skyriv213/paypick
    platform: linux/amd64  # 수정된 라인
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database-master:3306/ana?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect

  # Spring 애플리케이션 설정
  spring-app:
    build: 
      context: ./be
      dockerfile: Dockerfile
    container_name: spring-app
    ports:
      - "8443:8443"
    environment:
      - SPRING_DATASOURCE_MASTER_URL=${DB_MASTER_URL}
      - SPRING_DATASOURCE_MASTER_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_MASTER_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_SLAVE_URL=${DB_SLAVE_URL}
      - SPRING_DATASOURCE_SLAVE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_SLAVE_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
    depends_on:
      redis:
        condition: service_healthy
      redis-token:
        condition: service_healthy
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    # networks:
    #   - app_network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 40s

  # GPT 애플리케이션 설정
  gpt-app:
    build:
      context: ./gpt_be
      dockerfile: Dockerfile
    container_name: gpt-app
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql-master
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=project
      - MYSQL_PORT=3306
      - TZ=Asia/Seoul
      - JWT_SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - SSL_MODE=disabled
    depends_on:
      mysql-master:
        condition: service_healthy
    # networks:
    #   - app_network
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 30s

  # Nginx 설정
  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/letsencrypt-ssl/certificate.crt:/etc/nginx/ssl/certificate.crt
      - ./nginx/letsencrypt-ssl/private.key:/etc/nginx/ssl/private.key
    depends_on:
      spring-app:
        condition: service_started
      gpt-app:
        condition: service_started
    # networks:
    #   - app_network  

# networks:
#   app_network:
#     driver: bridge


